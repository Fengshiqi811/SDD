<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日报详情 · 智能日报生成器</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/prototype.css">
</head>
<body data-page="detail">
  <div class="shell">
    <div id="appShell"></div>

    <div class="page-head">
      <div>
        <h1 class="page-head__title">日报详情</h1>
        <p class="page-head__desc">
          只读展示 <code>DailyReport</code> 与采集层 <code>CommitRecord</code> /
          <code>TaskRecord</code> / <code>MessageRecord</code>。推送与删除 HTTP
          <span class="gap-tag">需后端新增</span>
        </p>
      </div>
      <div class="page-head__actions">
        <a class="btn btn--ghost" id="btnBack" href="report-list.html">返回列表</a>
        <a class="btn btn--default" id="btnRegen" href="report-generate.html">重新生成</a>
        <button type="button" class="btn btn--default" id="btnCopy">复制 Markdown</button>
        <button type="button" class="btn btn--primary" id="btnExport">导出 HTML</button>
        <button type="button" class="btn btn--default" id="btnNotifyEmail">推送邮件</button>
        <button type="button" class="btn btn--default" id="btnNotifyLark">推送飞书</button>
        <button type="button" class="btn btn--danger" id="btnDelete">删除</button>
      </div>
    </div>

    <div id="errorBox" class="alerts" hidden></div>

    <div id="detailLoading" class="panel">
      <div class="loading-mask" style="position:relative;min-height:240px">
        <div class="loading-box">
          <div class="spinner" aria-hidden="true"></div>
          <span>加载详情…</span>
        </div>
      </div>
    </div>

    <div id="detailMain" hidden>
      <!-- 页头元信息：report_date / team_name / generated_at / members -->
      <div class="meta-grid" aria-label="日报元信息">
        <div class="meta-item">
          <span class="meta-item__label">日期 · report_date</span>
          <span class="meta-item__value" id="metaDate">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-item__label">团队 · team_name</span>
          <span class="meta-item__value" id="metaTeam">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-item__label">生成于 · generated_at</span>
          <span class="meta-item__value" id="metaGenerated">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-item__label">成员 · members[].name</span>
          <span class="meta-item__value" id="metaMembers">—</span>
        </div>
      </div>

      <main class="workspace" style="margin-top:16px">
        <section class="pane pane--raw" aria-label="原始数据区" id="rawPane">
          <div class="pane__head pane__head--tabs">
            <h2 class="pane__title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
              原始数据区
            </h2>
            <div class="tabs" role="tablist" aria-label="原始数据来源">
              <button type="button" class="tab" role="tab" data-tab="github" aria-selected="true">
                GitHub 提交<span class="tab__badge" data-badge="github">0</span>
              </button>
              <button type="button" class="tab" role="tab" data-tab="lark_task" aria-selected="false">
                飞书任务<span class="tab__badge" data-badge="lark_task">0</span>
              </button>
              <button type="button" class="tab" role="tab" data-tab="lark_msg" aria-selected="false">
                飞书消息<span class="tab__badge" data-badge="lark_msg">0</span>
              </button>
            </div>
          </div>
          <div class="pane__body" id="rawBody" role="tabpanel" aria-label="原始数据表格"></div>
        </section>

        <section class="pane" aria-label="日报成品预览区">
          <div class="pane__head">
            <h2 class="pane__title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
              日报预览
            </h2>
            <span class="pane__spacer"></span>
            <span class="cell-muted" style="font-size:13px">markdown / html</span>
          </div>
          <div class="pane__body pane__body--pad" id="previewBody"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/mock-data.js"></script>
  <script src="assets/prototype.js"></script>
</body>
</html>
