[project]
name = "daily-report"
version = "0.1.0"
description = "智能日报生成器 — 从 GitHub/飞书采集数据并自动生成日报"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyyaml",
    "jinja2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "generator", "notifier", "shared"]
